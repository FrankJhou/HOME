<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vanished Cartographer — Three Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0e1526; --ink-800:#151f38; --ink-700:#1c2a4a;
    --paper:#ece0bd; --paper-dim:#d9c89c; --paper-dark:#c3ae7d;
    --brass:#c9a24d; --brass-bright:#e8c876; --brass-dark:#8a6a2b;
    --wax:#8a3324; --teal:#3f6259; --text-light:#f1e9d2; --text-muted:#a99f80;
    --shadow: rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, #22304f 0%, var(--ink-900) 55%, #060a14 100%);
    color:var(--text-light); font-family:'EB Garamond', serif; overflow-x:hidden;
  }
  .app{ max-width:1020px; margin:0 auto; padding:20px 16px 40px; }
  h1,h2,h3{ font-family:'Cormorant Garamond', serif; margin:0; letter-spacing:0.02em; }
  .titlebar{ display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:1px solid rgba(201,162,77,0.25); padding-bottom:10px; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
  .eyebrow{ font-family:'Courier Prime', monospace; font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--brass); opacity:0.85; margin-bottom:4px; }
  .titlebar h1{ font-size:28px; font-weight:700; color:var(--text-light); }
  .titlebar h1 em{ font-style:italic; color:var(--brass-bright); }
  .status{ display:flex; align-items:center; gap:12px; font-family:'Courier Prime', monospace; font-size:13px; color:var(--paper-dim); }
  .timer{ padding:6px 12px; border:1px solid var(--brass-dark); border-radius:3px; background:rgba(0,0,0,0.25); letter-spacing:0.08em; }
  .ghost-btn{ font-family:'Courier Prime', monospace; background:transparent; color:var(--brass-bright);
    border:1px solid var(--brass-dark); border-radius:3px; padding:6px 12px; cursor:pointer; font-size:13px; transition:background 0.2s, color 0.2s; }
  .ghost-btn:hover{ background:var(--brass-dark); color:var(--ink-900); }

  .room-tabs{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .room-tab{ font-family:'Courier Prime', monospace; font-size:12.5px; letter-spacing:0.06em;
    padding:8px 14px; border-radius:4px 4px 0 0; border:1px solid var(--brass-dark); border-bottom:none;
    background:rgba(255,255,255,0.03); color:var(--text-muted); cursor:pointer; }
  .room-tab.active{ background:var(--ink-700); color:var(--brass-bright); }
  .room-tab.locked{ opacity:0.55; cursor:not-allowed; }
  .room-tab .lock-ico{ margin-left:4px; }

  .scene-wrap{ position:relative; border-radius:6px; overflow:hidden; border:1px solid rgba(201,162,77,0.35);
    box-shadow:0 20px 60px var(--shadow), inset 0 0 80px rgba(0,0,0,0.5); }
  svg.scene{ display:block; width:100%; height:auto; }
  .hot{ cursor:pointer; }
  .hot:hover .hot-outline{ stroke:var(--brass-bright); stroke-width:2.5; filter:drop-shadow(0 0 6px rgba(232,200,118,0.65)); }
  .hot .hot-label{ opacity:0; transition:opacity 0.2s; font-family:'Courier Prime', monospace; font-size:12px; fill:var(--brass-bright); text-transform:uppercase; letter-spacing:0.12em; }
  .hot:hover .hot-label{ opacity:1; }

  .inventory{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; min-height:48px; align-items:center; }
  .inv-empty{ font-family:'Courier Prime', monospace; font-size:12px; color:var(--text-muted); letter-spacing:0.05em; }
  .inv-item{ display:flex; align-items:center; gap:8px; background:linear-gradient(180deg, var(--paper) 0%, var(--paper-dim) 100%);
    color:#2a2314; border-radius:4px; padding:6px 12px 6px 8px; font-family:'Courier Prime', monospace; font-size:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.4); border:1px solid var(--brass-dark); }

  .overlay{ position:fixed; inset:0; background:rgba(6,9,16,0.78); display:none; align-items:center; justify-content:center;
    z-index:50; padding:20px; backdrop-filter: blur(2px); }
  .overlay.show{ display:flex; }
  .modal{ background:linear-gradient(180deg, var(--paper) 0%, var(--paper-dim) 100%); color:#2a2314;
    max-width:500px; width:100%; border-radius:6px; padding:26px 26px 22px;
    box-shadow:0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px var(--brass-dark); position:relative; animation: rise 0.28s ease;
    max-height:88vh; overflow-y:auto; }
  @keyframes rise{ from{ transform:translateY(14px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal h2{ font-size:22px; color:#2a2314; margin-bottom:10px; border-bottom:1px solid var(--brass-dark); padding-bottom:8px; }
  .modal p{ line-height:1.55; font-size:16px; margin:0 0 12px; }
  .modal .close{ position:absolute; top:12px; right:14px; background:none; border:none; font-size:20px; color:#5a4d2c; cursor:pointer; line-height:1; }
  .modal .close:hover{ color:var(--wax); }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .btn{ font-family:'Courier Prime', monospace; font-size:13px; background:var(--ink-800); color:var(--brass-bright);
    border:1px solid var(--brass-dark); border-radius:4px; padding:9px 16px; cursor:pointer; letter-spacing:0.04em; transition:transform 0.12s, background 0.2s; }
  .btn:hover{ background:var(--ink-700); transform:translateY(-1px); }
  .btn.primary{ background:var(--brass-dark); color:#221a08; }
  .btn.primary:hover{ background:var(--brass); }

  .note-paper{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:18px; line-height:1.5; color:#3a2f18;
    background:rgba(255,255,255,0.18); border-left:3px solid var(--wax); padding:12px 16px; margin:14px 0; }

  .legend-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
  .legend-item{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.25); border-radius:4px; padding:8px 10px; font-family:'Courier Prime', monospace; font-size:14px; }
  .legend-sym{ font-size:20px; }

  .keypad-display{ font-family:'Courier Prime', monospace; font-size:26px; letter-spacing:0.4em; text-align:center;
    background:#1a1408; color:var(--brass-bright); border-radius:4px; padding:12px 0; margin:14px 0 10px; min-height:22px; }
  .keypad-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .keypad-grid button{ font-family:'Courier Prime', monospace; font-size:18px; padding:12px 0; border-radius:4px; border:1px solid var(--brass-dark); background:var(--paper-dark); color:#2a2314; cursor:pointer; }
  .keypad-grid button:hover{ background:var(--brass); }
  .keypad-msg{ min-height:20px; font-family:'Courier Prime', monospace; font-size:13px; color:var(--wax); text-align:center; margin-top:6px; }

  .word-input{ width:100%; font-family:'Courier Prime', monospace; font-size:22px; letter-spacing:0.5em; text-align:center;
    text-transform:uppercase; background:#1a1408; color:var(--brass-bright); border:1px solid var(--brass-dark); border-radius:4px;
    padding:12px 0; margin:14px 0 10px; }

  .dial-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; margin:14px 0; }
  .dial-svg{ touch-action:none; cursor:grab; }
  .dial-svg:active{ cursor:grabbing; }
  .dial-msg{ font-family:'Courier Prime', monospace; font-size:13px; min-height:18px; color:var(--wax); text-align:center; }
  .shake{ animation:shake 0.4s; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); }
    60%{ transform:translateX(-5px); } 80%{ transform:translateX(5px); } }

  .journal-list{ display:flex; flex-direction:column; gap:12px; }
  .journal-entry{ border-bottom:1px dashed var(--brass-dark); padding-bottom:10px; }

  .journal-entry p{ font-size:14.5px; margin:0; }
  .journal-room{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--brass-dark); margin:10px 0 2px; }

  footer{ margin-top:20px; text-align:center; font-family:'Courier Prime', monospace; font-size:11px; color:var(--text-muted); letter-spacing:0.08em; }

  @media (max-width:560px){ .titlebar h1{ font-size:22px; } .modal{ padding:20px 18px 18px; } }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div>
      <div class="eyebrow">A Harder Interactive Puzzle · 3 Rooms</div>
      <h1>The Vanished <em>Cartographer</em></h1>
    </div>
    <div class="status">
      <button class="ghost-btn" id="journalBtn">📖 Journal</button>
      <div class="timer" id="timer">00:00</div>
    </div>
  </div>

  <div class="room-tabs" id="roomTabs"></div>

  <div class="scene-wrap">
    <div id="sceneContainer"></div>
  </div>

  <div class="inventory" id="inventory">
    <span class="inv-empty">Your findings will appear here.</span>
  </div>

  <footer>STUDY → LIBRARY → OBSERVATORY — EACH ROOM HIDES WHAT THE NEXT ONE NEEDS</footer>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>

<script>
/* ---------------- STATE ---------------- */
const state = {
  started:false, startTime:null, timerInt:null, solved:false,
  currentRoom:'study',
  roomsUnlocked:{ study:true, library:false, observatory:false },
  clues:[], // {room,title,text}
  inv:[],   // {ico,label}
  study:{ paintingRead:false, clockRead:false, cipherRead:false, drawerOpen:false, safeOpen:false },
  library:{ atlasRead:false, cabinetOpen:false, globeOpen:false },
  observatory:{ chartRead:false, telescopeSolved:false, doorOpen:false }
};
const DRAWER_CODE = "4729";
const SAFE_BEARING = 315, SAFE_TOL = 12;      // NW
const CABINET_WORD = "TIDE";
const GLOBE_BEARING = 200, GLOBE_TOL = 12;    // southern route
const CHART_BEARING = 65, CHART_TOL = 10;     // azimuth
const FINAL_CODE = "2953";

const overlay = document.getElementById('overlay');
const modalBox = document.getElementById('modalBox');
const inventoryEl = document.getElementById('inventory');
const timerEl = document.getElementById('timer');
const sceneContainer = document.getElementById('sceneContainer');
const roomTabsEl = document.getElementById('roomTabs');

function openModal(html){ modalBox.innerHTML = html; overlay.classList.add('show');
  const c = modalBox.querySelector('.close'); if(c) c.addEventListener('click', closeModal); }
function closeModal(){ overlay.classList.remove('show'); modalBox.innerHTML=''; }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

function addClue(room, title, text){
  if(!state.clues.find(c=>c.title===title)) state.clues.push({room, title, text});
}
function addItem(ico, label){
  if(!state.inv.find(i=>i.label===label)) state.inv.push({ico, label});
  renderInventory();
}
function renderInventory(){
  if(state.inv.length===0){ inventoryEl.innerHTML = '<span class="inv-empty">Your findings will appear here.</span>'; return; }
  inventoryEl.innerHTML = state.inv.map(i=>`<div class="inv-item"><span>${i.ico}</span>${i.label}</div>`).join('');
}
function ensureStarted(){
  if(state.started) return;
  state.started = true; state.startTime = Date.now();
  state.timerInt = setInterval(updateTimer, 1000);
}
function updateTimer(){
  const el = Math.floor((Date.now()-state.startTime)/1000);
  timerEl.textContent = `${String(Math.floor(el/60)).padStart(2,'0')}:${String(el%60).padStart(2,'0')}`;
}
function stopTimer(){ clearInterval(state.timerInt); }

/* ---------------- ROOM TABS ---------------- */
function renderTabs(){
  const rooms = [ ['study','Study'], ['library','Library'], ['observatory','Observatory'] ];
  roomTabsEl.innerHTML = rooms.map(([key,label])=>{
    const unlocked = state.roomsUnlocked[key];
    const active = state.currentRoom===key ? 'active' : '';
    const locked = unlocked ? '' : 'locked';
    return `<button class="room-tab ${active} ${locked}" data-room="${key}">${label}${unlocked?'':' <span class="lock-ico">🔒</span>'}</button>`;
  }).join('');
  roomTabsEl.querySelectorAll('.room-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.room;
      if(!state.roomsUnlocked[key]){
        openModal(`<button class="close">✕</button><h2>Locked</h2><p>That door hasn't opened yet. There must be something more to find first.</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Back</button></div>`);
        return;
      }
      switchRoom(key);
    });
  });
}
function switchRoom(key){
  state.currentRoom = key;
  renderTabs();
  sceneContainer.innerHTML = ROOMS[key]();
}
function unlockRoom(key, msg){
  state.roomsUnlocked[key] = true;
  renderTabs();
  setTimeout(()=>{
    openModal(`<button class="close">✕</button><h2>A Way Through</h2><p>${msg}</p>
    <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Onward</button></div>`);
  }, 50);
}

/* ---------------- SHARED DIAL WIDGET ---------------- */
function dialSVG(id, labels){
  return `
  <div class="dial-wrap">
    <svg class="dial-svg" id="${id}" width="210" height="210" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="98" fill="#0e1526" stroke="#c9a24d" stroke-width="3"/>
      <circle cx="110" cy="110" r="98" fill="none" stroke="#8a6a2b" stroke-width="1" stroke-dasharray="2 6"/>
      <text x="110" y="26" text-anchor="middle" fill="#a99f80" font-family="Courier Prime, monospace" font-size="12">${labels[0]}</text>
      <text x="110" y="202" text-anchor="middle" fill="#a99f80" font-family="Courier Prime, monospace" font-size="12">${labels[1]}</text>
      <text x="196" y="115" text-anchor="middle" fill="#a99f80" font-family="Courier Prime, monospace" font-size="12">${labels[2]}</text>
      <text x="24" y="115" text-anchor="middle" fill="#a99f80" font-family="Courier Prime, monospace" font-size="12">${labels[3]}</text>
      <g id="${id}-needle" transform="rotate(0 110 110)">
        <polygon points="110,42 118,110 110,122 102,110" fill="#e8c876"/>
        <polygon points="110,178 118,110 110,98 102,110" fill="#8a3324"/>
      </g>
      <circle cx="110" cy="110" r="7" fill="#c9a24d"/>
    </svg>
    <div class="dial-msg" id="${id}-msg">Drag the needle, then lock it in.</div>
  </div>`;
}
function initDial(id, target, tol, onSuccess){
  const svg = document.getElementById(id);
  const needle = document.getElementById(id+'-needle');
  let bearing = 0, dragging = false; const cx=110, cy=110;
  function pointFromEvent(e){
    const rect = svg.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*(220/rect.width), y:(clientY-rect.top)*(220/rect.height) };
  }
  function setBearing(p){
    let b = Math.atan2(p.x-cx, -(p.y-cy)) * 180/Math.PI;
    if(b<0) b+=360; bearing=b;
    needle.setAttribute('transform', `rotate(${bearing} ${cx} ${cy})`);
  }
  function start(e){ dragging=true; setBearing(pointFromEvent(e)); e.preventDefault(); }
  function move(e){ if(!dragging) return; setBearing(pointFromEvent(e)); e.preventDefault(); }
  function end(){ dragging=false; }
  svg.addEventListener('mousedown', start);
  svg.addEventListener('touchstart', start, {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);
  return {
    check(){
      const diff = Math.min(Math.abs(bearing-target), 360-Math.abs(bearing-target));
      const msg = document.getElementById(id+'-msg');
      if(diff<=tol){ onSuccess(); }
      else{
        const wrap = svg.closest('.dial-wrap'); wrap.classList.add('shake');
        msg.textContent = "Not quite. It resists.";
        setTimeout(()=>wrap.classList.remove('shake'), 400);
      }
    }
  };
}

/* ---------------- SHARED KEYPAD WIDGET ---------------- */
function buildKeypad(targetCode, onSuccess, onFail){
  let buf = "";
  const grid = document.getElementById('keypadGrid');
  const display = document.getElementById('keypadDisplay');
  const msg = document.getElementById('keypadMsg');
  const digits = ['1','2','3','4','5','6','7','8','9','Clear','0','Enter'];
  grid.innerHTML = digits.map(d=>`<button data-d="${d}">${d}</button>`).join('');
  grid.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = btn.dataset.d;
      if(d==='Clear'){ buf=""; msg.textContent=""; }
      else if(d==='Enter'){
        if(buf===targetCode) onSuccess();
        else { msg.textContent="That isn't it."; buf=""; if(onFail) onFail(); }
      } else if(buf.length<targetCode.length){ buf+=d; }
      display.textContent = buf.length ? buf.split('').join(' ') : '\u00A0';
    });
  });
}

const studyHandlers = {
  'study-painting': ()=>{
    ensureStarted();
    state.study.paintingRead = true;
    addClue('Study','Behind the Painting','A riddle etched into the backing: "Take the letters in MIDNIGHT, subtract the letters in DUSK. That is my first digit."');
    openModal(`<button class="close">✕</button><h2>Behind the Painting</h2>
      <p>The frame swings out on a hidden hinge. Scratched into the wood backing:</p>
      <div class="note-paper">"Take the letters in MIDNIGHT, subtract the letters in DUSK. That is my first digit."</div>
      <p>MIDNIGHT has 8 letters. DUSK has 4. <strong>8 − 4 = 4.</strong> First digit: <strong>4</strong>.</p>
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Keep looking</button></div>`);
  },
  'study-clock': ()=>{
    ensureStarted();
    state.study.clockRead = true;

/* ---------------- ROOM REGISTRY + DELEGATION ---------------- */
const ROOMS = { study: studySVG, library: librarySVG, observatory: observatorySVG };
const ALL_HANDLERS = Object.assign({}, studyHandlers, libraryHandlers, observatoryHandlers);

sceneContainer.addEventListener('click', (e)=>{
  const hot = e.target.closest('[data-hot]');
  if(!hot) return;
  const key = hot.dataset.hot;
  if(ALL_HANDLERS[key]) ALL_HANDLERS[key]();
});

/* ---------------- JOURNAL ---------------- */
document.getElementById('journalBtn').addEventListener('click', ()=>{
  if(state.clues.length===0){
    openModal(`<button class="close">✕</button><h2>Journal</h2><p style="font-size:15px;">Nothing recorded yet. Start exploring the Study.</p>`);
    return;
  }
  const byRoom = { Study:[], Library:[], Observatory:[] };
  state.clues.forEach(c=>byRoom[c.room].push(c));
  let html = '<button class="close">✕</button><h2>Journal</h2><div class="journal-list">';
  Object.entries(byRoom).forEach(([room, entries])=>{
    if(entries.length===0) return;
    html += `<div class="journal-room">${room}</div>`;
    entries.forEach(c=> html += `<div class="journal-entry"><h3>${c.title}</h3><p>${c.text}</p></div>`);
  });
  html += '</div>';
  openModal(html);
});

/* ---------------- INIT ---------------- */
renderTabs();
sceneContainer.innerHTML = ROOMS.study();
renderInventory();
openModal(`<button class="close">✕</button><h2>The Vanished Cartographer</h2>

  <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Begin</button></div>`);
</script>

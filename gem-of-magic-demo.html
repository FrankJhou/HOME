<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest for the Gem of Magic — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1b1035;
    --dusk:#3b2160;
    --hill:#2a9d8f;
    --hill-dark:#1f7a70;
    --gold:#ffd166;
    --magic:#b088f9;
    --danger:#ef476f;
    --paper:#fff7e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% -20%, var(--dusk), var(--night) 70%);
    color:var(--paper);
    font-family:'Press Start 2P', monospace;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:16px;
  }
  h1{font-size:clamp(12px,3vw,20px);color:var(--gold);text-align:center;line-height:1.7;margin:10px 0 2px;text-shadow:0 3px 0 #00000055}
  .sub{font-size:clamp(8px,1.6vw,10px);color:var(--magic);margin-bottom:12px;text-align:center;line-height:1.8}
  #stage{position:relative;width:min(920px,100%);}
  canvas{
    width:100%;display:block;border:4px solid var(--gold);border-radius:10px;
    background:#0e0a22;image-rendering:pixelated;box-shadow:0 10px 40px #00000088;
    touch-action:none;
  }
  .controls{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;width:min(920px,100%);
  }
  .btn{
    font-family:inherit;font-size:10px;color:var(--night);
    background:var(--gold);border:0;border-bottom:5px solid #c99b2f;border-radius:8px;
    padding:14px 18px;cursor:pointer;user-select:none;flex:1;max-width:180px;min-width:110px;
  }
  .btn:active{transform:translateY(3px);border-bottom-width:2px}
  .btn.magic{background:var(--magic);border-bottom-color:#7a5cc4;color:#fff}
  .btn.slash{background:var(--danger);border-bottom-color:#b13052;color:#fff}
  .hint{font-size:8px;line-height:2;color:#cbbcf0;text-align:center;margin-top:12px;max-width:920px}
  kbd{background:#00000055;border:1px solid #ffffff33;border-radius:4px;padding:2px 6px;color:var(--gold)}
</style>
</head>
<body>
<h1>QUEST FOR THE GEM OF MAGIC</h1>
<div class="sub">an adventure fighting game &mdash; demo build</div>

<div id="stage"><canvas id="game" width="920" height="480"></canvas></div>

<div class="controls">
  <button class="btn magic" id="btnMove">&#9654; MOVE<br><small>(Enter)</small></button>
  <button class="btn" id="btnJump">&#9650; JUMP<br><small>(Arrow Up)</small></button>
  <button class="btn slash" id="btnSlash">&#10022; SLASH<br><small>(Space)</small></button>
</div>

<div class="hint">
  Hold <kbd>Enter</kbd> to move &bull; Press <kbd>&uarr;</kbd> to jump &bull; Press <kbd>Space</kbd> to slash monsters.<br>
  Reach the Kingdom of Magic and grab the Gem of Magic to WIN. Lose your three hearts and it's GAME OVER!
</div>

<script>
(() => {
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const GROUND = H - 80;
const GOAL = 5200;               // distance to the Kingdom of Magic

// ---------- input ----------
const keys = { move:false, jump:false, slash:false };
let jumpQueued = false, slashQueued = false, anyKey = false;

function press(k){ 
  anyKey = true;
  if(k==='move') keys.move = true;
  if(k==='jump') jumpQueued = true;
  if(k==='slash') slashQueued = true;
}
function release(k){ if(k==='move') keys.move = false; }

addEventListener('keydown', e => {
  if(['Enter','ArrowUp',' ','Spacebar'].includes(e.key)) e.preventDefault();
  if(e.key==='Enter') press('move');
  if(e.key==='ArrowUp' && !e.repeat) press('jump');
  if((e.key===' '||e.key==='Spacebar') && !e.repeat) press('slash');
});
addEventListener('keyup', e => { if(e.key==='Enter') release('move'); });

function bindBtn(id, k){
  const el = document.getElementById(id);
  const down = ev => { ev.preventDefault(); press(k); };
  const up   = ev => { ev.preventDefault(); release(k); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
}
bindBtn('btnMove','move'); bindBtn('btnJump','jump'); bindBtn('btnSlash','slash');
cvs.addEventListener('pointerdown', () => { anyKey = true; });

// ---------- game state ----------
let state, camX, hero, monsters, sparkles, shake, winT, time;

function makeMonsters(){
  const list = [];
  const spots = [700, 1150, 1600, 2100, 2500, 2950, 3400, 3800, 4250, 4700];
  for(const x of spots){
    list.push({
      x, y: GROUND, alive:true, hurtT:0,
      type: Math.random() < 0.5 ? 'slime' : 'imp',
      seed: Math.random()*10
    });
  }
  return list;
}

function reset(){
  state = 'title';
  camX = 0; shake = 0; winT = 0; time = 0;
  hero = { x:180, y:GROUND, vy:0, onGround:true, hearts:3, hurtT:0, slashT:0, walkT:0 };
  monsters = makeMonsters();
  sparkles = [];
}
reset();

// ---------- helpers ----------
function addSparkles(x, y, color, n=10){
  for(let i=0;i<n;i++){
    sparkles.push({x, y, vx:(Math.random()-0.5)*4, vy:-Math.random()*4-1, life:1, color});
  }
}

// ---------- update ----------
function update(dt){
  time += dt;
  if(shake > 0) shake -= dt*8;

  if(state === 'title'){
    if(anyKey){ anyKey=false; jumpQueued=slashQueued=false; state='play'; }
    return;
  }
  if(state === 'win'){ winT += dt; sparkleStep(dt); if(slashQueued||jumpQueued){reset();} jumpQueued=slashQueued=false; return; }
  if(state === 'lose'){ if(slashQueued||jumpQueued){reset();} jumpQueued=slashQueued=false; return; }

  // hero movement
  if(keys.move && hero.x < GOAL + 60){ hero.x += 220*dt; hero.walkT += dt*10; }
  if(jumpQueued && hero.onGround){ hero.vy = -560; hero.onGround = false; }
  jumpQueued = false;

  hero.vy += 1500*dt;
  hero.y += hero.vy*dt;
  if(hero.y >= GROUND){ hero.y = GROUND; hero.vy = 0; hero.onGround = true; }

  if(hero.hurtT > 0) hero.hurtT -= dt;
  if(hero.slashT > 0) hero.slashT -= dt;

  if(slashQueued){ slashQueued = false; if(hero.slashT <= 0) hero.slashT = 0.22; }

  // monsters
  for(const m of monsters){
    if(!m.alive) continue;
    // slimes hop in place, imps drift toward the hero a little
    if(m.type==='imp' && Math.abs(m.x - hero.x) < 320) m.x -= 55*dt;
    // slash hit
    if(hero.slashT > 0.08){
      const inFront = m.x > hero.x - 10 && m.x < hero.x + 110;
      const sameHeight = Math.abs(m.y - hero.y) < 70;
      if(inFront && sameHeight){
        m.alive = false;
        addSparkles(m.x, m.y-30, '#ffd166', 14);
      }
    }
    // contact damage
    if(m.alive && hero.hurtT <= 0){
      const hit = Math.abs(m.x - hero.x) < 40 && Math.abs(m.y - hero.y) < 50;
      if(hit){
        hero.hearts--; hero.hurtT = 1.2; shake = 1;
        addSparkles(hero.x, hero.y-40, '#ef476f', 10);
        if(hero.hearts <= 0){ state='lose'; }
      }
    }
  }

  sparkleStep(dt);

  // camera follows
  camX = Math.max(0, hero.x - 200);

  // reach the kingdom
  if(hero.x >= GOAL + 40 && state==='play'){
    state = 'win';
    addSparkles(hero.x, GROUND-120, '#b088f9', 40);
  }
}

function sparkleStep(dt){
  for(const s of sparkles){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.15; s.life-=dt*1.4; }
  sparkles = sparkles.filter(s=>s.life>0);
}

// ---------- drawing ----------
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

function drawBackground(){
  // stars
  ctx.fillStyle='#0e0a22'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){
    const sx = (i*97 - camX*0.1) % W, sy = (i*53) % (GROUND-140);
    const tw = (Math.sin(time*2+i)+1)/2;
    px((sx+W)%W, sy, 3, 3, `rgba(255,247,230,${0.2+0.5*tw})`);
  }
  // moon
  ctx.fillStyle='#fff7e6'; ctx.beginPath(); ctx.arc(W-120,80,34,0,7); ctx.fill();
  ctx.fillStyle='#0e0a22'; ctx.beginPath(); ctx.arc(W-108,72,28,0,7); ctx.fill();
  // far hills
  ctx.fillStyle='#241a4a';
  for(let i=-1;i<6;i++){
    const hx = i*300 - (camX*0.3)%300;
    ctx.beginPath(); ctx.arc(hx+150, GROUND+40, 170, Math.PI, 0); ctx.fill();
  }
  // near hills
  ctx.fillStyle='#31245e';
  for(let i=-1;i<7;i++){
    const hx = i*260 - (camX*0.55)%260;
    ctx.beginPath(); ctx.arc(hx+130, GROUND+70, 130, Math.PI, 0); ctx.fill();
  }
  // ground
  px(0,GROUND, W, H-GROUND, '#1f7a70');
  px(0,GROUND, W, 8, '#2a9d8f');
  for(let i=0;i<14;i++){
    const gx = (i*90 - camX)% (W+90);
    px((gx+W+90)%(W+90)-45, GROUND+24, 26, 6, '#186158');
  }
}

function drawCastle(){
  const x = GOAL - camX + 120;
  if(x > W + 300) {
    // distance sign
    return;
  }
  const baseY = GROUND;
  // glow
  const g = ctx.createRadialGradient(x, baseY-140, 20, x, baseY-140, 260);
  g.addColorStop(0,'rgba(176,136,249,0.35)'); g.addColorStop(1,'rgba(176,136,249,0)');
  ctx.fillStyle=g; ctx.fillRect(x-260, baseY-400, 520, 400);
  // towers
  px(x-110, baseY-170, 50, 170, '#5b3f9e');
  px(x+60,  baseY-170, 50, 170, '#5b3f9e');
  px(x-40,  baseY-230, 80, 230, '#6d4fb8');
  // battlements
  for(let i=0;i<3;i++){ px(x-110+i*18, baseY-184, 12, 14, '#5b3f9e'); px(x+60+i*18, baseY-184, 12, 14, '#5b3f9e'); }
  for(let i=0;i<4;i++){ px(x-40+i*22, baseY-246, 14, 16, '#6d4fb8'); }
  // roofs
  ctx.fillStyle='#ffd166';
  ctx.beginPath(); ctx.moveTo(x-115,baseY-184); ctx.lineTo(x-85,baseY-224); ctx.lineTo(x-55,baseY-184); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+55,baseY-184); ctx.lineTo(x+85,baseY-224); ctx.lineTo(x+115,baseY-184); ctx.fill();
  // door
  px(x-16, baseY-46, 32, 46, '#2b1a52');
  // gem above the gate
  drawGem(x, baseY-270, 1 + Math.sin(time*3)*0.08);
  // banner text
  ctx.fillStyle='#ffd166'; ctx.font='10px "Press Start 2P", monospace'; ctx.textAlign='center';
  ctx.fillText('KINGDOM OF MAGIC', x, baseY-320);
}

function drawGem(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='#b088f9';
  ctx.beginPath();
  ctx.moveTo(0,-18); ctx.lineTo(14,-4); ctx.lineTo(0,20); ctx.lineTo(-14,-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#d9c6ff';
  ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(6,-4); ctx.lineTo(0,6); ctx.lineTo(-6,-4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHero(){
  const x = hero.x - camX, y = hero.y;
  const flash = hero.hurtT > 0 && Math.floor(time*14)%2===0;
  if(flash) ctx.globalAlpha = 0.35;
  const bob = hero.onGround && keys.move ? Math.sin(hero.walkT)*2 : 0;
  // legs
  px(x-10, y-16+bob, 8, 16, '#2b1a52');
  px(x+4,  y-16-bob, 8, 16, '#2b1a52');
  // body armor
  px(x-13, y-40+bob*0.5, 28, 26, '#4ea8de');
  px(x-13, y-40+bob*0.5, 28, 6,  '#7cc6f0');
  // head + helmet
  px(x-9, y-58+bob*0.5, 20, 18, '#ffd9b3');
  px(x-11, y-62+bob*0.5, 24, 8, '#4ea8de');
  px(x+3, y-52+bob*0.5, 4, 4, '#1b1035'); // eye
  // sword
  if(hero.slashT > 0){
    const p = 1 - hero.slashT/0.22;
    ctx.save();
    ctx.translate(x+14, y-34);
    ctx.rotate(-1.4 + p*2.2);
    px(0,-4, 46, 8, '#fff7e6');
    px(0,-6, 10, 12, '#ffd166');
    ctx.restore();
    // slash arc
    ctx.strokeStyle = `rgba(255,209,102,${1-p})`;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x+10, y-34, 52, -1.2 + p*1.4, -0.6 + p*1.4); ctx.stroke();
  } else {
    px(x+12, y-38, 8, 26, '#cbbcf0'); // sheathed
  }
  ctx.globalAlpha = 1;
}

function drawMonster(m){
  const x = m.x - camX;
  if(x < -80 || x > W+80) return;
  const hop = Math.abs(Math.sin(time*4 + m.seed))* (m.type==='slime'?14:6);
  const y = m.y - hop;
  if(m.type==='slime'){
    px(x-18, y-26, 36, 26, '#7bd389');
    px(x-14, y-30, 28, 8, '#a5e8b0');
    px(x-8, y-18, 6, 6, '#1b1035');
    px(x+4, y-18, 6, 6, '#1b1035');
  } else {
    px(x-16, y-30, 32, 30, '#ef476f');
    // horns
    px(x-16, y-38, 6, 8, '#ffd166');
    px(x+10, y-38, 6, 8, '#ffd166');
    px(x-8, y-20, 6, 6, '#1b1035');
    px(x+4, y-20, 6, 6, '#1b1035');
    px(x-6, y-8, 12, 4, '#1b1035');
  }
}

function drawHUD(){
  // hearts
  for(let i=0;i<3;i++){
    const hx = 24 + i*36, hy = 26;
    ctx.fillStyle = i < hero.hearts ? '#ef476f' : '#3a2c60';
    ctx.beginPath();
    ctx.arc(hx-6, hy, 8, 0, 7); ctx.arc(hx+6, hy, 8, 0, 7);
    ctx.moveTo(hx-13, hy+3); ctx.lineTo(hx, hy+18); ctx.lineTo(hx+13, hy+3);
    ctx.fill();
  }
  // progress bar to the kingdom
  const bw = 260, bx = W - bw - 24, by = 20;
  px(bx, by, bw, 14, '#00000066');
  px(bx, by, Math.min(1, hero.x/GOAL)*bw, 14, '#b088f9');
  drawGem(bx + bw + 8, by + 7, 0.55);
  ctx.fillStyle='#cbbcf0'; ctx.font='8px "Press Start 2P", monospace'; ctx.textAlign='right';
  ctx.fillText('TO THE KINGDOM', bx + bw, by + 30);
}

function centerText(lines, big){
  ctx.textAlign='center';
  ctx.fillStyle='rgba(14,10,34,0.75)'; ctx.fillRect(0,0,W,H);
  lines.forEach((l,i)=>{
    ctx.fillStyle = l.c || '#fff7e6';
    ctx.font = `${l.s||12}px "Press Start 2P", monospace`;
    ctx.fillText(l.t, W/2, H/2 + (i - lines.length/2)*34 + (big?0:0));
  });
}

function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*8*shake,(Math.random()-0.5)*8*shake);
  drawBackground();
  drawCastle();
  for(const m of monsters) if(m.alive) drawMonster(m);
  drawHero();
  for(const s of sparkles){ ctx.globalAlpha=Math.max(0,s.life); px(s.x - camX, s.y, 5, 5, s.color); ctx.globalAlpha=1; }
  drawHUD();
  ctx.restore();

  if(state==='title'){
    centerText([
      {t:'QUEST FOR THE', s:14, c:'#ffd166'},
      {t:'GEM OF MAGIC', s:20, c:'#b088f9'},
      {t:'', s:8},
      {t:'ENTER = MOVE   UP = JUMP   SPACE = SLASH', s:8},
      {t:'press any key or tap to start', s:8, c:'#cbbcf0'},
    ]);
  }
  if(state==='win'){
    centerText([
      {t:'YOU GOT THE', s:12, c:'#cbbcf0'},
      {t:'GEM OF MAGIC!', s:20, c:'#b088f9'},
      {t:'', s:8},
      {t:'YOU WIN!', s:14, c:'#ffd166'},
      {t:'press SPACE to play again', s:8, c:'#cbbcf0'},
    ]);
    drawGem(W/2, H/2 - 120, 2 + Math.sin(time*3)*0.2);
  }
  if(state==='lose'){
    centerText([
      {t:'YOU LOST YOUR', s:12, c:'#cbbcf0'},
      {t:'THREE HEARTS...', s:16, c:'#ef476f'},
      {t:'', s:8},
      {t:'GAME OVER', s:14, c:'#ffd166'},
      {t:'press SPACE to try again', s:8, c:'#cbbcf0'},
    ]);
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

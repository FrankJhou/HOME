# .github/workflows/update-data.yml
# 觸發:任何 .xlsx 被推進 data/ 資料夾(用 GitHub 網頁上傳即可)
# 動作:解析 Excel → 注入 petchem_dashboard.html 的 EMBEDDED → commit 回 repo
# GitHub Pages 會隨新 commit 自動重新部署

name: Update dashboard data

on:
  push:
    paths:
      - 'data/*.xlsx'
  workflow_dispatch:   # 也可在 Actions 頁面手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Update embedded data
        run: python scripts/update_embedded.py data/latest.xlsx petchem_dashboard.html

      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add petchem_dashboard.html
          git diff --cached --quiet || git commit -m "auto: update dashboard data from data/latest.xlsx"
          git push

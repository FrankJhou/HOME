<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球股市類股個股動態｜每日彙整</title>
<style>
  :root{
    --bg:#EEF3EA;
    --panel:#FAFCF8;
    --panel-raised:#E4EDDF;
    --border:#CFDCC9;
    --ink:#25352C;
    --ink-dim:#51624F;
    --ink-faint:#7C8C77;
    --amber:#A5651F;
    --amber-dim:#7C4C18;
    --up:#2E7D4F;
    --down:#B33B2E;
    --flat:#6B7A6E;
    --serif:"Noto Serif TC","Source Han Serif TC","Georgia",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html{font-size:18px;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.55;
  }

  /* ---------- Header + ticker tape (signature element) ---------- */
  header.masthead{
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#F5F8F2,#EEF3EA);
    padding:22px clamp(16px,4vw,40px) 0;
  }
  .masthead-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px 24px;
    padding-bottom:16px;
  }
  .masthead-title{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(23px,2.9vw,32px);
    letter-spacing:0.02em;
    color:var(--ink);
    margin:0;
  }
  .masthead-title .accent{color:var(--amber);}
  .masthead-sub{
    font-family:var(--mono);
    font-size:13.5px;
    color:var(--ink-faint);
    letter-spacing:0.04em;
  }

  .market-tabs{
    display:flex;
    gap:6px;
    padding-bottom:14px;
  }
  .market-tab{
    all:unset;
    cursor:pointer;
    font-family:var(--mono);
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    padding:7px 18px;
    border:1px solid var(--border);
    border-radius:20px;
    color:var(--ink-dim);
    background:var(--panel);
    transition:all .15s ease;
  }
  .market-tab:hover{border-color:var(--amber); color:var(--amber-dim);}
  .market-tab.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#FFF9F0;
  }

  .tape-wrap{
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:#E4EBDF;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
  }
  .tape-wrap::before, .tape-wrap::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:48px;
    z-index:2;
    pointer-events:none;
  }
  .tape-wrap::before{left:0;background:linear-gradient(90deg,#E4EBDF, transparent);}
  .tape-wrap::after{right:0;background:linear-gradient(270deg,#E4EBDF, transparent);}
  .tape-track{
    display:inline-flex;
    align-items:center;
    gap:36px;
    padding:9px 0;
    animation:scroll-tape 38s linear infinite;
    font-family:var(--mono);
    font-size:15px;
  }
  .tape-wrap:hover .tape-track{ animation-play-state:paused; }
  @keyframes scroll-tape{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  .tape-item{display:inline-flex; align-items:center; gap:8px; color:var(--ink-dim);}
  .tape-item b{color:var(--ink); font-weight:600;}
  .tape-up{color:var(--up);}
  .tape-down{color:var(--down);}
  .tape-dot{color:var(--ink-faint);}

  /* ---------- Layout ---------- */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1180px;
    margin:0 auto;
  }

  nav.sidebar{
    width:230px;
    flex:0 0 230px;
    padding:28px 14px 60px 24px;
    position:sticky;
    top:0;
  }
  .sidebar-label{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.12em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin:0 0 12px 10px;
  }
  .date-list{list-style:none; margin:0; padding:0; border-left:1px solid var(--border);}
  .date-list li{position:relative;}
  .date-btn{
    all:unset;
    cursor:pointer;
    display:block;
    width:100%;
    padding:10px 10px 10px 18px;
    font-family:var(--mono);
    font-size:17px;
    color:var(--ink-dim);
    border-left:2px solid transparent;
    margin-left:-1px;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .date-btn:hover{color:var(--ink); background:rgba(232,163,61,0.06);}
  .date-btn.active{
    color:var(--amber);
    border-left:2px solid var(--amber);
    background:rgba(232,163,61,0.08);
    font-weight:600;
  }
  .date-btn .dow{
    display:block;
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .date-btn.active .dow{color:var(--amber-dim);}

  .sidebar-note{
    margin:22px 10px 0;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-faint);
    border-top:1px dashed var(--border);
    padding-top:14px;
  }

  main#content{
    flex:1;
    min-width:0;
    padding:28px clamp(16px,3vw,36px) 80px;
    border-left:1px solid var(--border);
  }

  .day-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .day-head h2{
    font-family:var(--serif);
    font-size:26px;
    margin:0;
    color:var(--ink);
    font-weight:600;
  }
  .day-range{
    font-family:var(--mono);
    font-size:14px;
    color:var(--ink-faint);
  }
  .day-desc{
    font-size:16px;
    color:var(--ink-dim);
    margin:8px 0 28px;
    line-height:1.7;
    max-width:70ch;
  }

  /* ---------- Sector card ---------- */
  .sector{
    margin-bottom:30px;
    border:1px solid var(--border);
    border-radius:3px;
    overflow:hidden;
    background:var(--panel);
  }
  .sector-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 16px;
    background:var(--panel-raised);
    border-bottom:1px solid var(--border);
  }
  .sector-swatch{
    width:9px; height:9px; border-radius:50%;
    flex:0 0 auto;
  }
  .sector-head h3{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:19px;
    color:var(--ink);
  }
  .sector-head span.en{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-faint);
  }

  table.movers{
    width:100%;
    border-collapse:collapse;
    font-size:15.5px;
  }
  table.movers th{
    text-align:left;
    font-family:var(--mono);
    font-weight:500;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding:9px 14px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.movers td{
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    color:var(--ink);
    vertical-align:top;
  }
  table.movers tr:last-child td{border-bottom:none;}
  table.movers tr:hover td{background:rgba(255,255,255,0.02);}
  td.ticker{font-family:var(--mono); font-weight:600; white-space:nowrap;}
  td.change{font-family:var(--mono); font-weight:600; white-space:nowrap;}
  td.period{font-family:var(--mono); font-size:13.5px; color:var(--ink-dim); white-space:nowrap;}
  td.note{color:var(--ink-dim); font-size:14.5px; line-height:1.6;}
  .chg-up{color:var(--up);}
  .chg-down{color:var(--down);}
  .chg-flat{color:var(--flat);}

  .sector-gap{
    padding:9px 16px;
    font-size:13px;
    color:var(--amber-dim);
    background:rgba(232,163,61,0.05);
    border-top:1px dashed var(--border);
    line-height:1.6;
  }
  .sector-sources{
    padding:9px 16px 12px;
    font-size:12.5px;
    color:var(--ink-faint);
    border-top:1px solid var(--border);
  }
  .sector-sources a{
    color:#1B6E8C;
    text-decoration:none;
    border-bottom:1px dotted rgba(27,110,140,0.45);
  }
  .sector-sources a:hover{color:#134F65;}
  .sector-sources .sep{color:var(--ink-faint); margin:0 6px;}

  .movers-news{
    padding:4px 16px 14px;
    border-top:1px solid var(--border);
  }
  .movers-news p{
    margin:8px 0;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-dim);
  }
  .movers-news p b{color:var(--ink); font-weight:600;}

  footer.foot{
    max-width:1180px;
    margin:0 auto;
    padding:20px clamp(16px,4vw,40px) 40px;
    font-size:12.5px;
    color:var(--ink-faint);
    border-top:1px solid var(--border);
  }

    .layout{flex-direction:column;}
    nav.sidebar{
      width:100%; flex:none;
      position:relative;
      padding:16px 16px 8px;
    }
    .date-list{display:flex; gap:4px; border-left:none; overflow-x:auto; padding-bottom:6px;}
    .date-list li{flex:0 0 auto;}
    .date-btn{border-left:none; border-bottom:2px solid transparent; padding:8px 12px; white-space:nowrap;}
    .date-btn.active{border-left:none; border-bottom:2px solid var(--amber);}
    main#content{border-left:none; padding:20px 16px 60px;}
    table.movers{font-size:13.5px;}
    td.note{display:none;}
    th:last-child{display:none;}
  }

  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
</style>
</head>

    desc: "日股週三小幅反落：日經225指數收66,115.60點，下跌116.59點（-0.18%），從上週二大漲後略為降溫。早盤受惠前一日美股半導體類股走高、以及台積電傳出調漲代工報價帶動需求擴大期待，AI／半導體相關股買盤湧入，一度大漲逾1,300點、重返67,000點關卡；但進入午盤後，受美國那斯達克100指數期貨走勢遲滯、南韓股市走弱牽動，加上今晚稍後美國大型科技股即將公布財報前市場觀望氣氛濃厚，中東情勢疑慮也持續構成壓力，主力權值股獲利了結賣壓湧現，尾盤終於翻黑坐收。東證主板上漲家數占53.9%，下跌占43.0%；成交量22.07億股（較前一日減少），成交金額約10兆4,377億日圓（較前一日增加）。日經225指數成分股騰落為122檔上漲、102檔下跌、1檔持平。33業種中，非鐵金屬、銀行業、批發業、石油‧煤炭製品、玻璃‧土石製品等上漲；服務業、空運業、零售業、精密儀器、倉儲‧運輸相關業等下跌。指數負貢獻前五名為迅銷（優衣庫母公司）、瑞可利控股、東京威力科創、軟銀集團、信越化學工業；正貢獻前五名為鎧俠控股、揖斐電、京瓷、太陽誘電、村田製作所。個股方面，多木化學因英國資產管理公司AVI大量持股曝光、市場預期將提出提升企業價值方案，單日大漲9.46%居東證主板漲幅首位；INS Source（インソース）因第三季累計決算增收增益、上市十週年紀念增配及庫藏股買回計畫，大漲9.35%；澁澤倉庫則因近期籌碼面疲弱持續破底，重挫13.95%居跌幅首位，該股所屬的倉儲‧運輸相關業本日也是最弱業種之一。此外，零售業因迅銷等權值股走弱而拖累，松屋、Ｊ．Front零售等個股跟著重挫；銀行業則因三菱UFJ等大型銀行股走強而領漲。本頁除了原有12個業種持續追蹤外，這次新增銀行業、纖維製品、倉儲‧運輸相關業3個先前未收錄的業種，並將零售業、化學、服務業、其他製品等業種更新至7/22最新收盤資料。",

    desc: "日股週二（連假後首個交易日）大幅反彈：日經225指數收66,232.19點，上漲2,091.07點（+3.26%），為近3個交易日以來最大單日漲幅。東京股市7/20（週一）因「海之日」國定假日休市、形成三連休，故本次比較基準為上週五（7/17）收盤的64,141.12點。東證主板（Prime市場）上漲家數占79.0%、下跌家數占18.8%，成交量約23.22億股、成交金額約9兆9,675億日圓。東證33業種中有31個業種上漲，僅「其他製品」與「水產‧農林業」2個業種下跌。半導體與電子零組件股全面重返買盤：上週因鉅額求償訴訟判決一度跌停的鎧俠控股（Kioxia HD）本日大幅反彈17.18%，是日經225指數最大貢獻個股之一；愛德萬測試（+7.73%）與軟銀集團（+6.03%）合計貢獻指數漲幅約775點。帶動因素包括美股半導體類股（費城半導體指數）週一（美東時間）大漲、南韓KOSPI指數同步大漲逾3%，以及中東情勢緊張（親伊朗武裝組織胡塞宣布封鎖沙烏地阿拉伯海運、川普總統警告可能加大報復攻擊）推升原油價格，帶動礦業、保險、石油煤炭等景氣循環股同步走高。任天堂（-4.13%）、科樂美集團（-1.99%）等娛樂股逆勢下跌，是唯二下跌業種之一；資訊通信業與零售業則呈現漲跌互見。本頁目前以東證33業種中資料確認較完整的12個業種為主，其餘21個業種尚待後續補充搜尋（詳見頁末說明）。",

const MARKETS = {
  us: {
    tabLabel: "美股",
    title: '美股類股<span class="accent">個股動態</span>',
    sub: "DAILY SECTOR MOVERS · U.S. EQUITIES",
    sidebarLabel: "日期索引",
    sidebarNote: "點選左側日期查看當天美股十一大類股個股動態。之後每次更新，會在此新增一個日期。",
    unitLabel: "美股十一大類股",
    moversTitle: "個股動態：收盤前大漲個股",
    moversEn: "Top Gainers at Close",
    moversCols: ["代號","公司","前一交易日收盤","最新收盤","漲跌點數","漲跌%","是否創新高"],
    sectorCols: ["代號","公司","漲跌","期間","備註"],
    data: US_DATA
  },
  jp: {
    tabLabel: "日股",
    title: '日股業種<span class="accent">個股動態</span>',
    sub: "DAILY SECTOR MOVERS · JAPAN EQUITIES (TSE)",
    sidebarLabel: "日期索引",
    sidebarNote: "點選左側日期查看當天日股東證33業種個股動態。之後每次更新，會在此新增一個日期。",
    unitLabel: "東證33業種",
    moversTitle: "個股動態：日經225指數貢獻度最大個股",
    moversEn: "Top Nikkei 225 Point Contributors",
    moversCols: ["代號","公司","前一交易日收盤","最新收盤","漲跌點數","漲跌%","對指數貢獻度"],
    sectorCols: ["代號","公司","漲跌","期間","備註"],
    data: JP_DATA
  }
};

let currentMarket = "us";

function currentDateKeys(){
  return Object.keys(MARKETS[currentMarket].data).sort().reverse();
}

function trendClass(t){
  if(t==="up") return "chg-up";
  if(t==="down") return "chg-down";
  return "chg-flat";
}

function renderMarketTabs(){
  const wrap = document.getElementById("marketTabs");
  wrap.innerHTML = "";
  Object.keys(MARKETS).forEach(key=>{
    const btn = document.createElement("button");
    btn.className = "market-tab" + (key===currentMarket ? " active":"");
    btn.textContent = MARKETS[key].tabLabel;
    btn.onclick = ()=> switchMarket(key);
    wrap.appendChild(btn);
  });
}

function switchMarket(marketKey){
  currentMarket = marketKey;
  const m = MARKETS[currentMarket];
  document.getElementById("marketTitle").innerHTML = m.title;
  document.getElementById("marketSub").textContent = m.sub;
  document.getElementById("sidebarLabel").textContent = m.sidebarLabel;
  document.getElementById("sidebarNote").textContent = m.sidebarNote;
  renderMarketTabs();
  buildTape();
  renderDay(currentDateKeys()[0]);
}

function renderSidebar(activeKey){
  const list = document.getElementById("dateList");
  list.innerHTML = "";
  const data = MARKETS[currentMarket].data;
  currentDateKeys().forEach(key=>{
    const d = data[key];
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "date-btn" + (key===activeKey ? " active":"");
    btn.innerHTML = d.label + '<span class="dow">' + d.dow + '</span>';
    btn.onclick = ()=> renderDay(key);
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function renderDay(key){
  const m = MARKETS[currentMarket];
  const d = m.data[key];
  const main = document.getElementById("content");

  let html = '';
  html += '<div class="day-head"><h2>' + d.label + ' ' + m.unitLabel + '個股動態</h2>';
  html += '<span class="day-range">' + d.range + '</span></div>';
  html += '<p class="day-desc">' + d.desc + '</p>';

  if(d.movers && d.movers.length){
    html += '<section class="sector movers-block">';
    html += '<div class="sector-head"><span class="sector-swatch" style="background:#C0392B"></span>';
    html += '<h3>' + m.moversTitle + '</h3><span class="en">' + m.moversEn + '</span></div>';
    html += '<table class="movers"><thead><tr>' + m.moversCols.map(c=>'<th>'+c+'</th>').join('') + '</tr></thead><tbody>';
    d.movers.forEach(row=>{
      const [ticker, company, prevClose, lastClose, ptChange, pctChange, lastCol] = row;
      html += '<tr><td class="ticker">' + ticker + '</td>';
      html += '<td>' + company + '</td>';
      html += '<td class="period">' + prevClose + '</td>';
      html += '<td class="period">' + lastClose + '</td>';
      html += '<td class="change chg-up">' + ptChange + '</td>';
      html += '<td class="change chg-up">' + pctChange + '</td>';
      html += '<td class="note">' + lastCol + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="movers-news">';
    d.movers.forEach(row=>{
      const ticker = row[0], company = row[1], news = row[7];
      html += '<p><b>' + ticker + '（' + company + '）：</b>' + news + '</p>';
    });
    html += '</div>';
    if(d.moversSources){
      html += '<div class="sector-sources">資料來源：　';
      html += d.moversSources.map(src=>'<a href="'+src[1]+'" target="_blank" rel="noopener">'+src[0]+'</a>').join('<span class="sep">｜</span>');
      html += '</div>';
    }
    html += '</section>';
  }

  d.sectors.forEach(s=>{
    html += '<section class="sector">';
    html += '<div class="sector-head"><span class="sector-swatch" style="background:' + s.color + '"></span>';
    html += '<h3>' + s.zh + '</h3><span class="en">' + s.en + '</span></div>';
    html += '<table class="movers"><thead><tr>' + m.sectorCols.map(c=>'<th>'+c+'</th>').join('') + '</tr></thead><tbody>';
    s.rows.forEach(r=>{
      const [ticker, company, change, trend, period, note] = r;
      html += '<tr><td class="ticker">' + ticker + '</td>';
      html += '<td>' + company + '</td>';
      html += '<td class="change ' + trendClass(trend) + '">' + change + '</td>';
      html += '<td class="period">' + period + '</td>';
      html += '<td class="note">' + note + '</td></tr>';
    });
    html += '</tbody></table>';
    if(s.gap){
      html += '<div class="sector-gap">⚠ ' + s.gap + '</div>';
    }
    html += '<div class="sector-sources">資料來源：　';
    html += s.sources.map(src=>'<a href="'+src[1]+'" target="_blank" rel="noopener">'+src[0]+'</a>').join('<span class="sep">｜</span>');
    html += '</div></section>';
  });

  if(d.missingIndustries){
    html += '<div class="sector-gap" style="margin-top:-10px;">⚠ 尚未收錄的業種（21個，待後續補充搜尋）：' + d.missingIndustries + '</div>';
  }

  main.innerHTML = html;
  renderSidebar(key);
}

function buildTape(){
  const track = document.getElementById("tapeTrack");
  const data = MARKETS[currentMarket].data;
  const latest = data[currentDateKeys()[0]];
  let items = [];
  latest.sectors.forEach(s=>{
    s.rows.forEach(r=>{
      items.push({ticker:r[0], change:r[2], trend:r[3]});
    });
  });
  const renderItems = (arr)=> arr.map(it=>{
    const cls = it.trend==="up" ? "tape-up" : (it.trend==="down" ? "tape-down" : "");
    return '<span class="tape-item"><b>'+it.ticker+'</b><span class="'+cls+'">'+it.change+'</span></span><span class="tape-dot">·</span>';
  }).join('');
  // duplicate for seamless loop
  track.innerHTML = renderItems(items) + renderItems(items);
}

// init
switchMarket("us");

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球股市類股個股動態｜每日彙整</title>
<style>
  :root{
    --bg:#EEF3EA;
    --panel:#FAFCF8;
    --panel-raised:#E4EDDF;
    --border:#CFDCC9;
    --ink:#25352C;
    --ink-dim:#51624F;
    --ink-faint:#7C8C77;
    --amber:#A5651F;
    --amber-dim:#7C4C18;
    --up:#2E7D4F;
    --down:#B33B2E;
    --flat:#6B7A6E;
    --serif:"Noto Serif TC","Source Han Serif TC","Georgia",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html{font-size:18px;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.55;
  }

  /* ---------- Header + ticker tape (signature element) ---------- */
  header.masthead{
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#F5F8F2,#EEF3EA);
    padding:22px clamp(16px,4vw,40px) 0;
  }
  .masthead-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px 24px;
    padding-bottom:16px;
  }
  .masthead-title{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(23px,2.9vw,32px);
    letter-spacing:0.02em;
    color:var(--ink);
    margin:0;
  }
  .masthead-title .accent{color:var(--amber);}
  .masthead-sub{
    font-family:var(--mono);
    font-size:13.5px;
    color:var(--ink-faint);
    letter-spacing:0.04em;
  }

  .market-tabs{
    display:flex;
    gap:6px;
    padding-bottom:14px;
  }
  .market-tab{
    all:unset;
    cursor:pointer;
    font-family:var(--mono);
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    padding:7px 18px;
    border:1px solid var(--border);
    border-radius:20px;
    color:var(--ink-dim);
    background:var(--panel);
    transition:all .15s ease;
  }
  .market-tab:hover{border-color:var(--amber); color:var(--amber-dim);}
  .market-tab.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#FFF9F0;
  }

  .tape-wrap{
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:#E4EBDF;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
  }
  .tape-wrap::before, .tape-wrap::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:48px;
    z-index:2;
    pointer-events:none;
  }
  .tape-wrap::before{left:0;background:linear-gradient(90deg,#E4EBDF, transparent);}
  .tape-wrap::after{right:0;background:linear-gradient(270deg,#E4EBDF, transparent);}
  .tape-track{
    display:inline-flex;
    align-items:center;
    gap:36px;
    padding:9px 0;
    animation:scroll-tape 38s linear infinite;
    font-family:var(--mono);
    font-size:15px;
  }
  .tape-wrap:hover .tape-track{ animation-play-state:paused; }
  @keyframes scroll-tape{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  .tape-item{display:inline-flex; align-items:center; gap:8px; color:var(--ink-dim);}
  .tape-item b{color:var(--ink); font-weight:600;}
  .tape-up{color:var(--up);}
  .tape-down{color:var(--down);}
  .tape-dot{color:var(--ink-faint);}

  /* ---------- Layout ---------- */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1180px;
    margin:0 auto;
  }

  nav.sidebar{
    width:170px;
    flex:0 0 170px;
    padding:28px 10px 60px 18px;
    position:sticky;
    top:0;
  }
  .sidebar-label{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.12em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin:0 0 12px 10px;
  }
  .date-list{list-style:none; margin:0; padding:0; border-left:1px solid var(--border);}
  .date-list li{position:relative;}
  .date-btn{
    all:unset;
    cursor:pointer;
    display:block;
    width:100%;
    padding:10px 8px 10px 14px;
    font-family:var(--mono);
    font-size:16px;
    color:var(--ink-dim);
    border-left:2px solid transparent;
    margin-left:-1px;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .date-btn:hover{color:var(--ink); background:rgba(232,163,61,0.06);}
  .date-btn.active{
    color:var(--amber);
    border-left:2px solid var(--amber);
    background:rgba(232,163,61,0.08);
    font-weight:600;
  }
  .date-btn .dow{
    display:block;
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .date-btn.active .dow{color:var(--amber-dim);}

  .sidebar-note{
    margin:22px 10px 0;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-faint);
    border-top:1px dashed var(--border);
    padding-top:14px;
  }

  main#content{
    flex:1;
    min-width:0;
    padding:28px clamp(16px,3vw,36px) 80px;
    border-left:1px solid var(--border);
  }

  .day-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .day-head h2{
    font-family:var(--serif);
    font-size:26px;
    margin:0;
    color:var(--ink);
    font-weight:600;
  }
  .day-range{
    font-family:var(--mono);
    font-size:14px;
    color:var(--ink-faint);
  }
  .day-desc{
    font-size:16px;
    color:var(--ink-dim);
    margin:8px 0 28px;
    line-height:1.7;
    max-width:70ch;
  }

  /* ---------- Sector card ---------- */
  .sector{
    margin-bottom:30px;
    border:1px solid var(--border);
    border-radius:3px;
    overflow:hidden;
    background:var(--panel);
  }
  .sector-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 16px;
    background:var(--panel-raised);
    border-bottom:1px solid var(--border);
  }
  .sector-swatch{
    width:9px; height:9px; border-radius:50%;
    flex:0 0 auto;
  }
  .sector-head h3{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:19px;
    color:var(--ink);
  }
  .sector-head span.en{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-faint);
  }

  table.movers{
    width:100%;
    border-collapse:collapse;
    font-size:15.5px;
  }
  table.movers th{
    text-align:left;
    font-family:var(--mono);
    font-weight:500;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding:9px 14px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.movers td{
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    color:var(--ink);
    vertical-align:top;
  }
  table.movers tr:last-child td{border-bottom:none;}
  table.movers tr:hover td{background:rgba(255,255,255,0.02);}
  td.ticker{font-family:var(--mono); font-weight:600; white-space:nowrap;}
  td.change{font-family:var(--mono); font-weight:600; white-space:nowrap;}
  td.period{font-family:var(--mono); font-size:13.5px; color:var(--ink-dim); white-space:nowrap;}
  td.note{color:var(--ink-dim); font-size:14.5px; line-height:1.6;}
  .chg-up{color:var(--up);}
  .chg-down{color:var(--down);}
  .chg-flat{color:var(--flat);}

  .sector-gap{
    padding:9px 16px;
    font-size:13px;
    color:var(--amber-dim);
    background:rgba(232,163,61,0.05);
    border-top:1px dashed var(--border);
    line-height:1.6;
  }
  .sector-sources{
    padding:9px 16px 12px;
    font-size:12.5px;
    color:var(--ink-faint);
    border-top:1px solid var(--border);
  }
  .sector-sources a{
    color:#1B6E8C;
    text-decoration:none;
    border-bottom:1px dotted rgba(27,110,140,0.45);
  }
  .sector-sources a:hover{color:#134F65;}
  .sector-sources .sep{color:var(--ink-faint); margin:0 6px;}

  .indices-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin:0 0 24px;
  }
  .index-card{
    flex:1 1 200px;
    min-width:170px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:4px;
    padding:14px 18px;
  }
  .index-card .idx-name{
    font-family:var(--serif);
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:2px;
  }
  .index-card .idx-en{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:0.03em;
  }
  .index-card .idx-value{
    font-family:var(--mono);
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    margin:8px 0 2px;
    letter-spacing:-0.01em;
  }
  .index-card .idx-change{
    font-family:var(--mono);
    font-size:14px;
    font-weight:600;
  }

  .movers-news{
    padding:4px 16px 14px;
    border-top:1px solid var(--border);
  }
  .movers-news p{
    margin:8px 0;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-dim);
  }
  .movers-news p b{color:var(--ink); font-weight:600;}

  footer.foot{
    max-width:1180px;
    margin:0 auto;
    padding:20px clamp(16px,4vw,40px) 40px;
    font-size:12.5px;
    color:var(--ink-faint);
    border-top:1px solid var(--border);
  }

  @media (max-width: 760px){
    .layout{flex-direction:column;}
    nav.sidebar{
      width:100%; flex:none;
      position:relative;
      padding:16px 16px 8px;
    }
    .date-list{display:flex; gap:4px; border-left:none; overflow-x:auto; padding-bottom:6px;}
    .date-list li{flex:0 0 auto;}
    .date-btn{border-left:none; border-bottom:2px solid transparent; padding:8px 12px; white-space:nowrap;}
    .date-btn.active{border-left:none; border-bottom:2px solid var(--amber);}
    main#content{border-left:none; padding:20px 16px 60px;}
    table.movers{font-size:13.5px;}
    td.note{display:none;}
    th:last-child{display:none;}
  }

  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
</style>
</head>

    desc: "日股週五連續第3個交易日走高：日經225指數收65,018.95點，大漲882.70點（+1.38%），重返6萬5,000點大關。早盤受惠前一晚美股費城半導體指數（SOX）大漲3.14%的激勵，半導體相關股率先領漲；午休時段，日本銀行公布金融政策決定會合結果：政策利率上調0.25個百分點至1.25%左右，符合市場預期。值得注意的是，此次會議有2名審議委員（淺田統一郎、佐藤綾野）投下反對票，並非全會一致通過，市場解讀日銀立場偏向「鴿派」，緩和貨幣環境可望延續的預期帶動買盤湧入半導體相關股。消息公布後，日經225指數於下午12時49分一度大漲1,300.32點觸及65,436.57點（當日高點）；惟隨後市場在植田和男總裁記者會與敬老の日三連休前浮現獲利了結賣壓及觀望氣氛，漲勢略微收斂。焦點個股鎧俠控股尾盤大漲9.40%、以最高價收在¥54,570作收，雷射科技同步大漲8.70%，帶動半導體/AI相關股全面走高。日經225指數成分股中，值上漲63檔、值下跌161檔、持平1檔，顯示漲勢仍集中在少數高股價權值股。日經225指數貢獻度上位為愛德萬測試、東京威力科創、鎧俠控股、揖斐電、軟銀集團；貢獻度下位則為KDDI、泰爾茂、伊藤忠商事、瑞可利控股、索尼。本頁本次已將電機/電子機器等業種更新至9/18最新收盤資料，聚焦日銀利率決議後半導體股全面反彈的行情。",

    desc: "日股週四續漲：日經225指數收64,136.25點，上漲213.25點（+0.33%），重返6萬4,000點大關。早盤受惠前一晚美股費城半導體指數（SOX）走高，半導體相關股集中買盤帶動，開盤即大漲逾720點觸及64,643.58點（同時也是當日高點），惟隨後漲勢明顯收斂，一度翻黑。主因是美國聯準會（FOMC）決議於台灣時間週四凌晨公布，市場對美日雙方利率動向保持警戒：美國FOMC決議升息1碼至3.75%-4.00%區間、暗示年內還有進一步升息可能；日本銀行則將於隔日（9/18）公布利率決議，市場預期升息0.25個百分點的機率升溫，投資人觀望氣氛濃厚。南韓KOSPI指數表現同樣疲弱，也拖累AI/半導體相關股出現獲利了結賣壓。後場買盤轉向日圓貶值受惠的汽車等出口股、殖利率上升可望改善利差的銀行與保險類金融股，以及先前表現落後的海運、醫藥品、鋼鐵等價值型（割安）股，成為支撐大盤的主力。日經225指數貢獻度上位為迅銷（優衣庫母公司）、軟銀集團、瑞可利控股、中外製藥、科樂美；貢獻度下位則為愛德萬測試、東京威力科創、TDK、揖斐電、鎧俠控股。東證主板成交量19.5662億股、成交金額約7兆1538億日圓。本頁本次已將零售業、服務業、醫藥品、其他製品等業種更新至9/17最新收盤資料，聚焦FOMC平穩通過後日銀利率決議前的觀望氣氛與價值股輪動行情。",

let currentMarket = "us";

function currentDateKeys(){
  return Object.keys(MARKETS[currentMarket].data).sort().reverse();
}

function trendClass(t){
  if(t==="up") return "chg-up";
  if(t==="down") return "chg-down";
  return "chg-flat";
}

function renderMarketTabs(){
  const wrap = document.getElementById("marketTabs");
  wrap.innerHTML = "";
  Object.keys(MARKETS).forEach(key=>{
    const btn = document.createElement("button");
    btn.className = "market-tab" + (key===currentMarket ? " active":"");
    btn.textContent = MARKETS[key].tabLabel;
    btn.onclick = ()=> switchMarket(key);
    wrap.appendChild(btn);
  });
}

function switchMarket(marketKey){
  currentMarket = marketKey;
  const m = MARKETS[currentMarket];
  document.getElementById("marketTitle").innerHTML = m.title;
  document.getElementById("marketSub").textContent = m.sub;
  document.getElementById("sidebarLabel").textContent = m.sidebarLabel;
  document.getElementById("sidebarNote").textContent = m.sidebarNote;
  renderMarketTabs();
  buildTape();
  renderDay(currentDateKeys()[0]);
}

function renderSidebar(activeKey){
  const list = document.getElementById("dateList");
  list.innerHTML = "";
  const data = MARKETS[currentMarket].data;
  currentDateKeys().forEach(key=>{
    const d = data[key];
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "date-btn" + (key===activeKey ? " active":"");
    btn.innerHTML = d.label + '<span class="dow">' + d.dow + '</span>';
    btn.onclick = ()=> renderDay(key);
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function renderDay(key){
  const m = MARKETS[currentMarket];
  const d = m.data[key];
  const main = document.getElementById("content");

  let html = '';
  html += '<div class="day-head"><h2>' + d.label + ' ' + m.unitLabel + '個股動態</h2>';
  html += '<span class="day-range">' + d.range + '</span></div>';
  html += '<p class="day-desc">' + d.desc + '</p>';

  if(d.indices && d.indices.length){
    html += '<div class="indices-row">';
    d.indices.forEach(idx=>{
      const [name, en, value, change, pct, trend] = idx;
      const cls = trend==="up" ? "chg-up" : (trend==="down" ? "chg-down" : "chg-flat");
      html += '<div class="index-card"><div class="idx-name">' + name + '</div>';
      html += '<div class="idx-en">' + en + '</div>';
      html += '<div class="idx-value">' + value + '</div>';
      html += '<div class="idx-change ' + cls + '">' + change + '（' + pct + '）</div></div>';
    });
    html += '</div>';
  }

  if(d.movers && d.movers.length){
    html += '<section class="sector movers-block">';
    html += '<div class="sector-head"><span class="sector-swatch" style="background:#C0392B"></span>';
    html += '<h3>' + m.moversTitle + '</h3><span class="en">' + m.moversEn + '</span></div>';
    html += '<table class="movers"><thead><tr>' + m.moversCols.map(c=>'<th>'+c+'</th>').join('') + '</tr></thead><tbody>';
    d.movers.forEach(row=>{
      const [ticker, company, prevClose, lastClose, ptChange, pctChange, lastCol] = row;
      html += '<tr><td class="ticker">' + ticker + '</td>';
      html += '<td>' + company + '</td>';
      html += '<td class="period">' + prevClose + '</td>';
      html += '<td class="period">' + lastClose + '</td>';
      html += '<td class="change chg-up">' + ptChange + '</td>';
      html += '<td class="change chg-up">' + pctChange + '</td>';
      html += '<td class="note">' + lastCol + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="movers-news">';
    d.movers.forEach(row=>{
      const ticker = row[0], company = row[1], news = row[7];
      html += '<p><b>' + ticker + '（' + company + '）：</b>' + news + '</p>';
    });
    html += '</div>';
    if(d.moversSources){
      html += '<div class="sector-sources">資料來源：　';
      html += d.moversSources.map(src=>'<a href="'+src[1]+'" target="_blank" rel="noopener">'+src[0]+'</a>').join('<span class="sep">｜</span>');
      html += '</div>';
    }
    html += '</section>';
  }

  d.sectors.forEach(s=>{
    html += '<section class="sector">';
    html += '<div class="sector-head"><span class="sector-swatch" style="background:' + s.color + '"></span>';
    html += '<h3>' + s.zh + '</h3><span class="en">' + s.en + '</span></div>';
    html += '<table class="movers"><thead><tr>' + m.sectorCols.map(c=>'<th>'+c+'</th>').join('') + '</tr></thead><tbody>';
    s.rows.forEach(r=>{
      const [ticker, company, prevClose, lastClose, ptChange, change, trend, period, note] = r;
      html += '<tr><td class="ticker">' + ticker + '</td>';
      html += '<td>' + company + '</td>';
      html += '<td class="period">' + prevClose + '</td>';
      html += '<td class="period">' + lastClose + '</td>';
      html += '<td class="change ' + trendClass(trend) + '">' + ptChange + '</td>';
      html += '<td class="change ' + trendClass(trend) + '">' + change + '</td>';
      html += '<td class="period">' + period + '</td>';
      html += '<td class="note">' + note + '</td></tr>';
    });
    html += '</tbody></table>';
    if(s.gap){
      html += '<div class="sector-gap">⚠ ' + s.gap + '</div>';
    }
    html += '<div class="sector-sources">資料來源：　';
    html += s.sources.map(src=>'<a href="'+src[1]+'" target="_blank" rel="noopener">'+src[0]+'</a>').join('<span class="sep">｜</span>');
    html += '</div></section>';
  });

  if(d.missingIndustries){
    html += '<div class="sector-gap" style="margin-top:-10px;">⚠ 尚未收錄的業種（21個，待後續補充搜尋）：' + d.missingIndustries + '</div>';
  }

  main.innerHTML = html;
  renderSidebar(key);
}

function buildTape(){
  const track = document.getElementById("tapeTrack");
  const data = MARKETS[currentMarket].data;
  const latest = data[currentDateKeys()[0]];
  let items = [];
  latest.sectors.forEach(s=>{
    s.rows.forEach(r=>{
      items.push({ticker:r[0], change:r[2], trend:r[3]});
    });
  });
  const renderItems = (arr)=> arr.map(it=>{
    const cls = it.trend==="up" ? "tape-up" : (it.trend==="down" ? "tape-down" : "");
    return '<span class="tape-item"><b>'+it.ticker+'</b><span class="'+cls+'">'+it.change+'</span></span><span class="tape-dot">·</span>';
  }).join('');
  // duplicate for seamless loop
  track.innerHTML = renderItems(items) + renderItems(items);
}

// init
switchMarket("us");
</script>

<style>
  :root{
    --bg:#EEF3EA;
    --panel:#FAFCF8;
    --panel-raised:#E4EDDF;
    --border:#CFDCC9;
    --ink:#25352C;
    --ink-dim:#51624F;
    --ink-faint:#7C8C77;
    --amber:#A5651F;
    --amber-dim:#7C4C18;
    --up:#2E7D4F;
    --down:#B33B2E;
    --flat:#6B7A6E;
    --serif:"Noto Serif TC","Source Han Serif TC","Georgia",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html{font-size:18px;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.55;
  }

  /* ---------- Header + ticker tape (signature element) ---------- */
  header.masthead{
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#F5F8F2,#EEF3EA);
    padding:22px clamp(16px,4vw,40px) 0;
  }
  .masthead-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px 24px;
    padding-bottom:16px;
  }
  .masthead-title{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(23px,2.9vw,32px);
    letter-spacing:0.02em;
    color:var(--ink);
    margin:0;
  }
  .masthead-title .accent{color:var(--amber);}
  .masthead-sub{
    font-family:var(--mono);
    font-size:13.5px;
    color:var(--ink-faint);
    letter-spacing:0.04em;
  }

  .tape-wrap{
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:#E4EBDF;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
  }
  .tape-wrap::before, .tape-wrap::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:48px;
    z-index:2;
    pointer-events:none;
  }
  .tape-wrap::before{left:0;background:linear-gradient(90deg,#E4EBDF, transparent);}
  .tape-wrap::after{right:0;background:linear-gradient(270deg,#E4EBDF, transparent);}
  .tape-track{
    display:inline-flex;
    align-items:center;
    gap:36px;
    padding:9px 0;
    animation:scroll-tape 38s linear infinite;
    font-family:var(--mono);
    font-size:15px;
  }
  .tape-wrap:hover .tape-track{ animation-play-state:paused; }
  @keyframes scroll-tape{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  .tape-item{display:inline-flex; align-items:center; gap:8px; color:var(--ink-dim);}
  .tape-item b{color:var(--ink); font-weight:600;}
  .tape-up{color:var(--up);}
  .tape-down{color:var(--down);}
  .tape-dot{color:var(--ink-faint);}

  /* ---------- Layout ---------- */
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1180px;
    margin:0 auto;
  }

  nav.sidebar{
    width:230px;
    flex:0 0 230px;
    padding:28px 14px 60px 24px;
    position:sticky;
    top:0;
  }
  .sidebar-label{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.12em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin:0 0 12px 10px;
  }
  .date-list{list-style:none; margin:0; padding:0; border-left:1px solid var(--border);}
  .date-list li{position:relative;}
  .date-btn{
    all:unset;
    cursor:pointer;
    display:block;
    width:100%;
    padding:10px 10px 10px 18px;
    font-family:var(--mono);
    font-size:17px;
    color:var(--ink-dim);
    border-left:2px solid transparent;
    margin-left:-1px;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .date-btn:hover{color:var(--ink); background:rgba(232,163,61,0.06);}
  .date-btn.active{
    color:var(--amber);
    border-left:2px solid var(--amber);
    background:rgba(232,163,61,0.08);
    font-weight:600;
  }
  .date-btn .dow{
    display:block;
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .date-btn.active .dow{color:var(--amber-dim);}

  .sidebar-note{
    margin:22px 10px 0;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-faint);
    border-top:1px dashed var(--border);
    padding-top:14px;
  }

  main#content{
    flex:1;
    min-width:0;
    padding:28px clamp(16px,3vw,36px) 80px;
    border-left:1px solid var(--border);
  }

  .day-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .day-head h2{
    font-family:var(--serif);
    font-size:26px;
    margin:0;
    color:var(--ink);
    font-weight:600;
  }
  .day-range{
    font-family:var(--mono);
    font-size:14px;
    color:var(--ink-faint);
  }
  .day-desc{
    font-size:16px;
    color:var(--ink-dim);
    margin:8px 0 28px;
    line-height:1.7;
    max-width:70ch;
  }

  /* ---------- Sector card ---------- */
  .sector{
    margin-bottom:30px;
    border:1px solid var(--border);
    border-radius:3px;
    overflow:hidden;
    background:var(--panel);
  }
  .sector-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 16px;
    background:var(--panel-raised);
    border-bottom:1px solid var(--border);
  }
  .sector-swatch{
    width:9px; height:9px; border-radius:50%;
    flex:0 0 auto;
  }
  .sector-head h3{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:19px;
    color:var(--ink);
  }
  .sector-head span.en{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-faint);
  }

  table.movers{
    width:100%;
    border-collapse:collapse;
    font-size:15.5px;
  }
  table.movers th{
    text-align:left;
    font-family:var(--mono);
    font-weight:500;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding:9px 14px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.movers td{
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    color:var(--ink);
    vertical-align:top;
  }
  table.movers tr:last-child td{border-bottom:none;}
  table.movers tr:hover td{background:rgba(255,255,255,0.02);}
  td.ticker{font-family:var(--mono); font-weight:600; white-space:nowrap;}
  td.change{font-family:var(--mono); font-weight:600; white-space:nowrap;}
  td.period{font-family:var(--mono); font-size:13.5px; color:var(--ink-dim); white-space:nowrap;}
  td.note{color:var(--ink-dim); font-size:14.5px; line-height:1.6;}
  .chg-up{color:var(--up);}
  .chg-down{color:var(--down);}
  .chg-flat{color:var(--flat);}

  .sector-gap{
    padding:9px 16px;
    font-size:13px;
    color:var(--amber-dim);
    background:rgba(232,163,61,0.05);
    border-top:1px dashed var(--border);
    line-height:1.6;
  }
  .sector-sources{
    padding:9px 16px 12px;
    font-size:12.5px;
    color:var(--ink-faint);
    border-top:1px solid var(--border);
  }
  .sector-sources a{
    color:#1B6E8C;
    text-decoration:none;
    border-bottom:1px dotted rgba(27,110,140,0.45);
  }
  .sector-sources a:hover{color:#134F65;}
  .sector-sources .sep{color:var(--ink-faint); margin:0 6px;}

  .movers-news{
    padding:4px 16px 14px;
    border-top:1px solid var(--border);
  }
  .movers-news p{
    margin:8px 0;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-dim);
  }
  .movers-news p b{color:var(--ink); font-weight:600;}

  footer.foot{
    max-width:1180px;
    margin:0 auto;
    padding:20px clamp(16px,4vw,40px) 40px;
    font-size:12.5px;
    color:var(--ink-faint);
    border-top:1px solid var(--border);
  }

  @media (max-width: 760px){
    .layout{flex-direction:column;}
    nav.sidebar{
      width:100%; flex:none;
      position:relative;
      padding:16px 16px 8px;
    }
    .date-list{display:flex; gap:4px; border-left:none; overflow-x:auto; padding-bottom:6px;}
    .date-list li{flex:0 0 auto;}
    .date-btn{border-left:none; border-bottom:2px solid transparent; padding:8px 12px; white-space:nowrap;}
    .date-btn.active{border-left:none; border-bottom:2px solid var(--amber);}
    main#content{border-left:none; padding:20px 16px 60px;}
    table.movers{font-size:13.5px;}
    td.note{display:none;}
    th:last-child{display:none;}
  }

  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
</style>
</head>

const dateKeys = Object.keys(DATA).sort().reverse();

function trendClass(t){
  if(t==="up") return "chg-up";
  if(t==="down") return "chg-down";
  return "chg-flat";
}

function renderSidebar(activeKey){
  const list = document.getElementById("dateList");
  list.innerHTML = "";
  dateKeys.forEach(key=>{
    const d = DATA[key];
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "date-btn" + (key===activeKey ? " active":"");
    btn.innerHTML = d.label + '<span class="dow">' + d.dow + '</span>';
    btn.onclick = ()=> renderDay(key);
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function renderDay(key){
  const d = DATA[key];
  const main = document.getElementById("content");

  let html = '';
  html += '<div class="day-head"><h2>' + d.label + ' 美股十一大類股個股動態</h2>';
  html += '<span class="day-range">' + d.range + '</span></div>';
  html += '<p class="day-desc">' + d.desc + '</p>';

  if(d.movers && d.movers.length){
    html += '<section class="sector movers-block">';
    html += '<div class="sector-head"><span class="sector-swatch" style="background:#C0392B"></span>';
    html += '<h3>個股動態：收盤前大漲個股</h3><span class="en">Top Gainers at Close</span></div>';
    html += '<table class="movers"><thead><tr><th>代號</th><th>公司</th><th>前一交易日收盤</th><th>最新收盤</th><th>漲跌點數</th><th>漲跌%</th><th>是否創新高</th></tr></thead><tbody>';
    d.movers.forEach(m=>{
      const [ticker, company, prevClose, lastClose, ptChange, pctChange, highNote, news] = m;
      html += '<tr><td class="ticker">' + ticker + '</td>';
      html += '<td>' + company + '</td>';
      html += '<td class="period">' + prevClose + '</td>';
      html += '<td class="period">' + lastClose + '</td>';
      html += '<td class="change chg-up">' + ptChange + '</td>';
      html += '<td class="change chg-up">' + pctChange + '</td>';
      html += '<td class="note">' + highNote + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="movers-news">';
    d.movers.forEach(m=>{
      const [ticker, company, , , , , , news] = m;
      html += '<p><b>' + ticker + '（' + company + '）：</b>' + news + '</p>';
    });
    html += '</div>';
    if(d.moversSources){
      html += '<div class="sector-sources">資料來源：　';
      html += d.moversSources.map(src=>'<a href="'+src[1]+'" target="_blank" rel="noopener">'+src[0]+'</a>').join('<span class="sep">｜</span>');
      html += '</div>';
    }
    html += '</section>';
  }

  d.sectors.forEach(s=>{
    html += '<section class="sector">';
    html += '<div class="sector-head"><span class="sector-swatch" style="background:' + s.color + '"></span>';
    html += '<h3>' + s.zh + '</h3><span class="en">' + s.en + '</span></div>';
    html += '<table class="movers"><thead><tr><th>代號</th><th>公司</th><th>漲跌</th><th>期間</th><th>備註</th></tr></thead><tbody>';
    s.rows.forEach(r=>{
      const [ticker, company, change, trend, period, note] = r;
      html += '<tr><td class="ticker">' + ticker + '</td>';
      html += '<td>' + company + '</td>';
      html += '<td class="change ' + trendClass(trend) + '">' + change + '</td>';
      html += '<td class="period">' + period + '</td>';
      html += '<td class="note">' + note + '</td></tr>';
    });
    html += '</tbody></table>';
    if(s.gap){
      html += '<div class="sector-gap">⚠ ' + s.gap + '</div>';
    }
    html += '<div class="sector-sources">資料來源：　';
    html += s.sources.map(src=>'<a href="'+src[1]+'" target="_blank" rel="noopener">'+src[0]+'</a>').join('<span class="sep">｜</span>');
    html += '</div></section>';
  });

  main.innerHTML = html;
  renderSidebar(key);
}

function buildTape(){
  const track = document.getElementById("tapeTrack");
  const latest = DATA[dateKeys[0]];
  let items = [];
  latest.sectors.forEach(s=>{
    s.rows.forEach(r=>{
      items.push({ticker:r[0], change:r[2], trend:r[3]});
    });
  });
  const renderItems = (arr)=> arr.map(it=>{
    const cls = it.trend==="up" ? "tape-up" : (it.trend==="down" ? "tape-down" : "");
    return '<span class="tape-item"><b>'+it.ticker+'</b><span class="'+cls+'">'+it.change+'</span></span><span class="tape-dot">·</span>';
  }).join('');
  // duplicate for seamless loop
  track.innerHTML = renderItems(items) + renderItems(items);
}

// init
buildTape();
renderDay(dateKeys[0]);
</script>
